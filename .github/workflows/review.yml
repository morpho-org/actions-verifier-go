name: Lupin

on: # zizmor: ignore[dangerous-triggers] -- lupin.yml checks out the base commit; PR content is only inspected in the sandbox
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read

jobs:
  lupin:
    # Ceiling for lupin.yml's jobs; each job requests only its part.
    permissions:
      actions: write
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    uses: morpho-org/internal-tools/.github/workflows/lupin.yml@a1a3149257e0fdc570399e12398a7e40bd59bb9b # @morpho-org/review-cli@0.66.1
    with:
      delivery: comment
      disable-merge-gate: true
      runner-provider: github
      pr: ${{ inputs.pr }}
    secrets:
      LUPIN_APP_PRIVATE_KEY: ${{ secrets.LUPIN_APP_PRIVATE_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      LUPIN_LINEAR_CLIENT_SECRET: ${{ secrets.LUPIN_LINEAR_CLIENT_SECRET }}
      LUPIN_BETTERSTACK_API_TOKEN: ${{ secrets.LUPIN_BETTERSTACK_API_TOKEN }}
