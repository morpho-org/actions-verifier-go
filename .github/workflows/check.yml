name: Go checks

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: go-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Format, verify and lint the Go module
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
          go mod download
          go mod verify
          go mod tidy -diff
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      minimum-attempt: ${{ matrix.minimum && steps.race.outputs.attempt || '' }}
      stable-attempt: ${{ !matrix.minimum && steps.race.outputs.attempt || '' }}
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        include:
          - go-version: '1.25.1'
            minimum: true
          - go-version: '1.27.4'
            minimum: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Require the root Go module
        run: test -f go.mod
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Verify the declared minimum Go version
        if: matrix.minimum
        env:
          MINIMUM_GO: ${{ matrix.go-version }}
        run: |
          declared="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          if [ "$declared" != "$MINIMUM_GO" ]; then
            printf 'Update the minimum Go version in the CI matrix to %s\n' "$declared"
            exit 1
          fi
      - name: Run Go race tests
        id: race
        run: |
          go test -race ./...
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  npm-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install checksum-verified Node.js
        run: |
          node_dir="$(mktemp -d "$RUNNER_TEMP/npm-parity-node.XXXXXXXXXX")"
          cd "$node_dir"
          version=26.13.1
          archive="node-v${version}-linux-x64.tar.xz"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
            --output "$archive" "https://nodejs.org/dist/v${version}/${archive}"
          printf '%s  %s\n' '5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864' "$archive" | sha256sum --check --strict
          tar --extract --xz --file "$archive" --strip-components=1
          rm -rf -- lib/node_modules/npm lib/node_modules/corepack
          rm -f -- bin/npm bin/npx bin/corepack
          printf 'PARITY_NODE=%s/bin/node\n' "$node_dir" >> "$GITHUB_ENV"
      - name: Fetch and verify locked registry tarballs
        run: python3 testdata/npm-parity/install.py
      - name: Replay published verifier offline
        run: '"$PARITY_NODE" --permission --allow-fs-read="$PWD/testdata" testdata/npm-parity/replay.mjs'

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint, test]
    steps:
      - name: Require lint and both race test jobs to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MINIMUM_ATTEMPT: ${{ needs.test.outputs.minimum-attempt }}
          STABLE_ATTEMPT: ${{ needs.test.outputs.stable-attempt }}
        run: |
          if [ "$LINT_RESULT" != success ] || [ "$TEST_RESULT" != success ]; then
            printf 'Go checks did not pass: lint=%s, test=%s\n' "$LINT_RESULT" "$TEST_RESULT"
            exit 1
          fi
          if [ "$MINIMUM_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ] || [ "$STABLE_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            printf 'Both Go versions must pass race tests in this attempt. Re-run all jobs.\n'
            exit 1
          fi

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
